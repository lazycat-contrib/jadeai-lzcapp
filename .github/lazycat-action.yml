version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/jadeai.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: jadeaiapp
build:
  run_buildscript: false
images:
  # 上游有完整三段 SemVer tag（0.0.x~0.7.0），排除 latest/main 别名
  - id: jadeaiapp
    target: service
    service: jadeaiapp
    source: twwch/jadeai
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: JadeAI
    summary: "AI 驱动的智能简历生成器"
